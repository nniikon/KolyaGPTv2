name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: nniikon/kolyagpt:d561fe473123a9290e1a0d44d92de4c630b88f8e

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
        cmake -B build -S .
        cmake --build build --parallel

    - name: Run tests
      run: cd build && ctest --output-on-failure
